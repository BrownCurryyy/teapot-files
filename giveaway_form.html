<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="giveaway_styles.css" />
</head>
<body>

<a href="index.html" class="logo-link">
  <img src="images/logo.jpg" alt="Dunder Mifflin Logo" class="logo" />
</a>
  
<div class="form-header">
  <br><br><br><br>
  <br><br><br><br>
  <br><br><br><br>
  <h1 class="h1">Under Construction...</h1>
  <p class="subtitle">Sorry for the inconvience</p>

<button class="teapot-tag" onclick="burstFlower()">#PamCult 🌸</button>
  <div class="flower-container" id="flowerContainer"></div>

  <script>
function burstFlower() {
  const container = document.getElementById('flowerContainer');
  const flower = document.createElement('div');
  flower.classList.add('flower');
  flower.textContent = '🌸';

  // Random offset for chaotic beauty
  const offsetX = Math.random() * 40 - 10;
  const offsetY = Math.random() * 2;

  flower.style.right = `${offsetX}px`;
  flower.style.bottom = `${offsetY}px`;

  container.appendChild(flower);

  // Clean up after animation
  setTimeout(() => {
    container.removeChild(flower);
  }, 1000);
}
</script>

</div>
</body>
